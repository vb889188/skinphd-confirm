services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: confirm
      POSTGRES_USER: confirm
      POSTGRES_PASSWORD: ${CONFIRM_DB_PASSWORD:-confirm-local-db}
    volumes:
      - confirm-pgdata:/var/lib/postgresql/data
      - ./deploy/confirm.sql:/docker-entrypoint-initdb.d/001_confirm.sql:ro
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confirm -d confirm"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  confirm:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://nncecsszisodfnaibjyw.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-sb_publishable_Awm7V0LMYhv7l8nEqoVfOQ_4xqV-Sqs}
        VITE_CONFIRM_WORKSPACE_KEY: ${VITE_CONFIRM_WORKSPACE_KEY:-sph-confirm-7f3a9c2e-brooklyn}
        VITE_CONFIRM_MODE: production
        VITE_CONFIRM_PUBLIC_URL: ${VITE_CONFIRM_PUBLIC_URL:-https://confirm.relpdev.uk}
    ports:
      - "80:8080"
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      VITE_AUTH_ENABLED: "false"
      MAIL_FROM: ${MAIL_FROM:-SkinPhD Confirm <info@relpdev.uk>}
      DATABASE_URL: postgres://confirm:${CONFIRM_DB_PASSWORD:-confirm-local-db}@postgres:5432/confirm
      CONFIRM_WORKSPACE_KEY: ${VITE_CONFIRM_WORKSPACE_KEY:-sph-confirm-7f3a9c2e-brooklyn}
      CONFIRM_SESSION_SECRET: ${CONFIRM_SESSION_SECRET:-sph-confirm-7f3a9c2e-brooklyn}
      CONFIRM_PUBLIC_URL: ${CONFIRM_PUBLIC_URL:-https://confirm.relpdev.uk}
      SUPABASE_URL: ${VITE_SUPABASE_URL:-https://nncecsszisodfnaibjyw.supabase.co}
      SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-sb_publishable_Awm7V0LMYhv7l8nEqoVfOQ_4xqV-Sqs}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  confirm-pgdata:
