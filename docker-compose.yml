services:
  confirm:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL must be set in the environment}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY must be set in the environment}
        VITE_CONFIRM_WORKSPACE_KEY: ${VITE_CONFIRM_WORKSPACE_KEY:?VITE_CONFIRM_WORKSPACE_KEY must be set in the environment}
        VITE_CONFIRM_MODE: production
    ports:
      - "80:8080"
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      VITE_AUTH_ENABLED: "false"
      MAIL_FROM: ${MAIL_FROM:-SkinPhD Confirm <info@relpdev.uk>}
    restart: unless-stopped
